<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – EdTech Training Hub</title>
  <meta name="description" content="Create your EdTech Training Hub account to enroll in courses, join live coaching sessions and start building practical digital skills.">
  <link rel="canonical" href="https://edutechtraininghub.vercel.app/signup.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EdTech Training Hub">
  <meta property="og:title" content="Sign Up | EdTech Training Hub">
  <meta property="og:description" content="Create your EdTech Training Hub account to enroll in courses, join live coaching sessions and start building practical digital skills.">
  <meta property="og:url" content="https://edutechtraininghub.vercel.app/signup.html">
  <meta property="og:image" content="https://edutechtraininghub.vercel.app/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="EdTech Training Hub - create your account and enroll in a course">
  <meta property="og:locale" content="en_NG">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sign Up | EdTech Training Hub">
  <meta name="twitter:description" content="Create your account and start building practical digital skills today.">
  <meta name="twitter:image" content="https://edutechtraininghub.vercel.app/images/og-image.jpg">
  <link rel="icon" type="image/x-icon" href="images/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth-page>

  <header class="site-header site-header--solid">
    <div class="container header__inner">
      <a href="index.html" class="brand" aria-label="EdTech Training Hub – Back to home">
        <img src="images/logo/Logo.jpeg" alt="EdTech Training Hub Ltd logo" class="brand__logo" width="40" height="40">
        <span class="brand__text">
          <span class="brand__name">EdTech Training Hub</span>
          <span class="brand__tag">Learn · Teach · Create · Thrive</span>
        </span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header__actions">
        <a href="login.html" class="login-link" aria-label="Login to student portal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="login-text">Login</span>
        </a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top:120px">
      <div class="container">
        <div class="form-card reveal">
          <div class="form-card__header">
            <h1 class="form-card__title">Create Your Account</h1>
            <p class="form-card__sub">Sign up to enrol in courses and access the student portal.</p>
          </div>
          <div class="form-alert" id="signupAlert"></div>
          <form class="auth-form" id="signupForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="signup-fname">First Name</label>
                <input class="form-control" type="text" id="signup-fname" name="fname" placeholder="Chinwe" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="signup-lname">Last Name</label>
                <input class="form-control" type="text" id="signup-lname" name="lname" placeholder="Okafor" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-email">Email Address</label>
              <input class="form-control" type="email" id="signup-email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-phone">Phone Number</label>
              <input class="form-control" type="tel" id="signup-phone" name="phone" placeholder="0801 234 5678" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-password">Password</label>
              <div class="pass-wrap">
                <input class="form-control" type="password" id="signup-password" name="password" placeholder="Min. 8 characters" required>
                <button type="button" class="pass-toggle" data-target="signup-password" aria-label="Show password">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="strength" id="pwStrength"><span></span><span></span><span></span><span></span></div>
              <div class="strength-text" id="pwStrengthText"></div>
            </div>
            <div class="form-group">
              <label class="form-label" for="signup-confirm">Confirm Password</label>
              <div class="pass-wrap">
                <input class="form-control" type="password" id="signup-confirm" name="confirm" placeholder="Re-enter password" required>
                <button type="button" class="pass-toggle" data-target="signup-confirm" aria-label="Show password">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group" style="margin-top:24px">
              <button type="submit" class="btn btn--primary btn--full">Create Account</button>
            </div>
          </form>
          <div class="form-card__foot">
            <p>Already have an account? <a href="login.html">Log in here</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer__bottom">
      <div class="footer__bottom__inner">
        <span>&copy; 2026 EdTech Training Hub Ltd. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
