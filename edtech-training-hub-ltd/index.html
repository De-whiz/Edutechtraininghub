<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EdTech Training Hub Ltd | Empowering Better Learning Through Technology</title>
    <meta name="description" content="EdTech Training Hub helps educators, institutions, knowledge professionals, course creators and learners use technology to teach better, learn effectively and create meaningful digital learning experiences." />
    <meta property="og:title" content="EdTech Training Hub Ltd | Empowering Better Learning Through Technology" />
    <meta property="og:description" content="EdTech Training Hub helps educators, institutions, knowledge professionals, course creators and learners use technology to teach better, learn effectively and create meaningful digital learning experiences." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Static book-opening loader shown while the app boots */
      @keyframes eth-static-flap-left {
        0% { transform: perspective(700px) rotateY(0deg); }
        40% { transform: perspective(700px) rotateY(-168deg); }
        50% { transform: perspective(700px) rotateY(-180deg); }
        55% { transform: perspective(700px) rotateY(-168deg); }
        100% { transform: perspective(700px) rotateY(0deg); }
      }
      @keyframes eth-static-flap-right {
        0% { transform: perspective(700px) rotateY(0deg); }
        30% { transform: perspective(700px) rotateY(168deg); }
        40% { transform: perspective(700px) rotateY(180deg); }
        45% { transform: perspective(700px) rotateY(168deg); }
        100% { transform: perspective(700px) rotateY(0deg); }
      }
      @keyframes eth-static-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      #eth-static-loader {
        position: fixed; inset: 0; z-index: 999;
        background: #f8fafc;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        font-family: 'Outfit', sans-serif;
      }
      #eth-static-loader .book {
        position: relative; width: 88px; height: 64px;
        perspective: 700px;
        animation: eth-static-bounce 1.6s ease-in-out infinite;
      }
      #eth-static-loader .spine {
        position: absolute; left: 50%; top: 0; bottom: 0; width: 3px;
        margin-left: -1.5px; background: #1E4E79; border-radius: 2px; z-index: 5;
      }
      #eth-static-loader .flap {
        position: absolute; top: 4px; bottom: 4px; width: 50%;
        border-radius: 5px 9px 9px 5px; backface-visibility: hidden;
      }
      #eth-static-loader .flap-left {
        left: 0; transform-origin: 100% 50%;
        background: linear-gradient(105deg, #ffffff, #dfeaf3);
        border: 1px solid rgba(30,78,121,0.45);
        animation: eth-static-flap-left 1.6s ease-in-out infinite;
      }
      #eth-static-loader .flap-right {
        right: 0; transform-origin: 0% 50%;
        background: linear-gradient(105deg, #ffffff, #c9e2e9);
        border: 1px solid rgba(15,107,120,0.45);
        animation: eth-static-flap-right 1.6s ease-in-out infinite;
      }
      #eth-static-loader .mark {
        position: absolute; top: -6px; left: 50%; width: 10px; height: 14px;
        margin-left: -5px; background: #F15A29; border-radius: 0 0 4px 4px; z-index: 6;
      }
      #eth-static-loader p {
        margin: 0; font-size: 14px; font-weight: 700; color: #1E4E79; letter-spacing: 0.02em;
      }
      @media (prefers-reduced-motion: reduce) {
        #eth-static-loader .book,
        #eth-static-loader .flap,
        #eth-static-loader .mark { animation: none; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-[#F15A29]/20 selection:text-[#F15A29]">
    <div id="root">
      <div id="eth-static-loader">
        <div class="book">
          <div class="spine"></div>
          <div class="flap flap-left"></div>
          <div class="flap flap-right"></div>
          <div class="mark"></div>
        </div>
        <p>Preparing your learning experience&hellip;</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
