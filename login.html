<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – EdTech Training Hub</title>
  <link rel="icon" type="image/x-icon" href="images/logo/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-auth-page>

  <header class="site-header site-header--solid">
    <div class="container header__inner">
      <a href="index.html" class="brand" aria-label="EdTech Training Hub – Back to home">
        <img src="images/logo/Logo.jpeg" alt="EdTech Training Hub Ltd logo" class="brand__logo" width="40" height="40">
        <span class="brand__text">
          <span class="brand__name">EdTech Training Hub</span>
          <span class="brand__tag">Learn · Teach · Create · Thrive</span>
        </span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header__actions">
        <a href="signup.html" class="btn btn--primary btn--enroll">Enroll Now</a>
      </div>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top:120px">
      <div class="container">
        <div class="form-card reveal">
          <div class="form-card__header">
            <h1 class="form-card__title">Welcome Back</h1>
            <p class="form-card__sub">Log in to the student portal to access your courses.</p>
          </div>
          <div class="form-alert" id="loginAlert"></div>
          <form class="auth-form" id="loginForm" novalidate>
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input class="form-control" type="email" id="login-email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <div style="display:flex;align-items:center;justify-content:space-between">
                <label class="form-label" for="login-password">Password</label>
                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
              </div>
              <div class="pass-wrap">
                <input class="form-control" type="password" id="login-password" name="password" placeholder="Enter your password" required>
                <button type="button" class="pass-toggle" data-target="login-password" aria-label="Show password">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group" style="margin-top:24px">
              <button type="submit" class="btn btn--primary btn--full">Log In</button>
            </div>
          </form>
          <div class="form-card__foot">
            <p>Don&rsquo;t have an account? <a href="signup.html">Sign up here</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer__bottom">
      <div class="footer__bottom__inner">
        <span>&copy; 2026 EdTech Training Hub Ltd. All rights reserved.</span>
      </div>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
